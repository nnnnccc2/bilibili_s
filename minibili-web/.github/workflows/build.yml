name: Build IPA

# 说明：当 minibili-web/ 作为独立仓库（仓库根目录即是本项目）时使用此工作流。
# 若本项目作为子目录存在于其它仓库中，请改用仓库根目录的
# .github/workflows/build-minibili-web.yml（GitHub Actions 只识别仓库根的 .github/workflows）。

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build MiniBiliWeb IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, arm64)
        run: |
          xcodebuild build \
            -project MiniBiliWeb.xcodeproj \
            -scheme MiniBiliWeb \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64"

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "MiniBiliWeb.app" | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MiniBiliWeb-unsigned.ipa Payload/ -x "*.DS_Store"
          ls -la MiniBiliWeb-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniBiliWeb-unsigned-ipa
          path: MiniBiliWeb-unsigned.ipa
          retention-days: 30
