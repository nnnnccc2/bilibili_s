name: Build BiliBili IPA

on:
  push:
    # 只在本 App 的专用分支上构建。main 会被 account-save 自动化强制推送覆盖成
    # 不含过滤功能的旧源码，若跟着 main 构建，latest Release 就会被"过滤失效"的包覆盖。
    branches: [ bilibili-app ]
    paths:
      - 'AccountKeeper/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build BiliBili IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 无论由哪个 ref 触发，始终构建 bilibili-app 分支的源码。
          ref: bilibili-app

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Record compile time
        id: compile_time
        run: |
          COMPILE_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "compile_time=$COMPILE_TIME"
          echo "compile_time=$COMPILE_TIME" >> $GITHUB_OUTPUT

      - name: Build for iOS Device (arm64)
        run: |
          xcodebuild build \
            -project AccountKeeper.xcodeproj \
            -scheme AccountKeeper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            VALID_ARCHS="arm64"

      - name: Locate built .app
        id: find_app
        run: |
          APP_PATH=$(find build -name "BiliBili.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "BiliBili.app" -path "*iphoneos*" | head -1)
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "=== App contents ==="
          ls -la "$APP_PATH"

      - name: Inject compile time into Info.plist
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          COMPILE_TIME="${{ steps.compile_time.outputs.compile_time }}"
          INFO_PLIST="$APP_PATH/Info.plist"
          echo "Injecting compile time: $COMPILE_TIME"
          /usr/libexec/PlistBuddy -c "Add :BuildCompileTime string '$COMPILE_TIME'" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :BuildCompileTime '$COMPILE_TIME'" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :BuildCompileTime" "$INFO_PLIST"

      - name: Ad-hoc sign app
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          echo "Signing app: $APP_PATH"
          codesign --force --sign - \
            --entitlements AccountKeeper/AccountKeeper.entitlements \
            "$APP_PATH/BiliBili"
          echo "=== Verify app entitlements ==="
          codesign -d --entitlements - "$APP_PATH/BiliBili" 2>/dev/null | head -20
          echo "Signing complete"

      - name: Package into IPA
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/BiliBili.app
          zip -r BiliBili.ipa Payload/ -x "*.DS_Store"
          echo "IPA created: BiliBili.ipa"
          ls -la BiliBili.ipa
          echo "=== IPA contents ==="
          unzip -l BiliBili.ipa

      - name: Verify filter features are compiled in
        env:
          APP_PATH: ${{ steps.find_app.outputs.app_path }}
        run: |
          # 用 Python 做字节级匹配而不是 strings/grep：
          # strings 默认不输出 UTF-8 中文，grep 在非 UTF-8 locale 下也会误判。
          python3 - <<'PY'
          import os, sys
          path = os.path.join(os.environ["APP_PATH"], "BiliBili")
          data = open(path, "rb").read()
          needed = ["通用关键词过滤", "B站分区屏蔽", "标签屏蔽 (Tag)", "一键屏蔽高频低质区", "数据诊断"]
          missing = [s for s in needed if s.encode("utf-8") not in data]
          for s in needed:
              print(("OK   " if s.encode("utf-8") in data else "MISS ") + s)
          if missing:
              print("::error::构建产物缺少过滤功能，拒绝发布。缺失: %s" % missing)
              sys.exit(1)
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili-iOS18-ipa
          path: BiliBili.ipa
          retention-days: 30

      - name: Publish IPA to GitHub Release (force refresh)
        if: github.ref == 'refs/heads/bilibili-app' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPILE_TIME: ${{ steps.compile_time.outputs.compile_time }}
        run: |
          set -e
          echo "Deleting old 'latest' release if it exists..."
          gh release delete latest --yes --cleanup-tag 2>/dev/null || echo "No existing release to delete"
          sleep 2
          echo "Writing release notes..."
          cat > RELEASE_NOTES.md <<'NOTES_EOF'
          # BiliBili iOS 18 - 第三方哔哩哔哩客户端

          | 项目 | 值 |
          |------|-----|
          | 架构 | arm64 |
          | 部署目标 | iOS 18.0 |
          | 编译时间 | __COMPILE_TIME__ |
          | 签名方式 | ad-hoc |

          ## 功能
          - 全站垃圾视频自动过滤（标题党、日语标题、日语UP主、短视频、侮辱贬低词）
          - B站一级/二级分区屏蔽（按官方分区目录，含一键屏蔽高频低质区）
          - 通用关键词过滤（命中标题/UP主/简介/分类/tag，内置词库 + 自定义）
          - 标签(Tag)屏蔽（内置标签库 + 自定义，推荐/热门自动补拉 tag 后生效）
          - 分类黑名单、UP主黑名单
          - 过滤规则对首页推荐、热门、直播、影视与搜索视频流全局生效
          - 搜索结果按时长过滤
          - 纯净无弹幕视频播放
          - 观看历史管理
          - 二维码 / 短信验证码登录

          ## 安装
          使用 Sideloadly 或 AltStore 配合 Apple ID 重签名后安装。
          NOTES_EOF
          sed -i '' "s/__COMPILE_TIME__/$COMPILE_TIME/g" RELEASE_NOTES.md
          echo "Creating new 'latest' release with fresh IPA..."
          gh release create latest BiliBili.ipa \
            --title "BiliBili Latest Build" \
            --notes-file RELEASE_NOTES.md
          echo "Release created successfully"
          gh release view latest --json assets --jq '.assets[].name'

          # 同时发布到 bilibili-latest：main 分支上的旧工作流只会覆盖 latest，
          # 不会碰这个 tag，因此它是唯一稳定的下载地址。
          echo "Mirroring to stable tag 'bilibili-latest'..."
          gh release delete bilibili-latest --yes --cleanup-tag 2>/dev/null || true
          sleep 1
          gh release create bilibili-latest BiliBili.ipa \
            --title "BiliBili 稳定构建（含完整过滤）" \
            --notes-file RELEASE_NOTES.md
          gh release view bilibili-latest --json assets --jq '.assets[].name'
