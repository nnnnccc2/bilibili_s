name: Build AccountKeeper IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build AccountKeeper IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Record compile time
        id: compile_time
        run: |
          COMPILE_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "compile_time=$COMPILE_TIME"
          echo "compile_time=$COMPILE_TIME" >> $GITHUB_OUTPUT

      - name: Build for iOS Device (arm64)
        run: |
          xcodebuild build \
            -project AccountKeeper.xcodeproj \
            -scheme AccountKeeper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            VALID_ARCHS="arm64"

      - name: Locate built .app
        id: find_app
        run: |
          APP_PATH=$(find build -name "AccountKeeper.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "AccountKeeper.app" -path "*iphoneos*" | head -1)
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "=== App contents ==="
          ls -la "$APP_PATH"
          echo "=== PlugIns (extensions) ==="
          ls -la "$APP_PATH/PlugIns" 2>/dev/null || echo "No PlugIns"

      - name: Inject compile time into Info.plist
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          COMPILE_TIME="${{ steps.compile_time.outputs.compile_time }}"
          INFO_PLIST="$APP_PATH/Info.plist"
          echo "Injecting compile time: $COMPILE_TIME"
          /usr/libexec/PlistBuddy -c "Add :BuildCompileTime string '$COMPILE_TIME'" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :BuildCompileTime '$COMPILE_TIME'" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :BuildCompileTime" "$INFO_PLIST"

      - name: Ad-hoc sign app and extension
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          # Sign the extension first, then the app
          for APPEX in "$APP_PATH/PlugIns"/*.appex; do
            if [ -d "$APPEX" ]; then
              echo "Signing extension: $APPEX"
              codesign --force --sign - --entitlements /dev/null "$APPEX" 2>&1 || true
            fi
          done
          echo "Signing app: $APP_PATH"
          codesign --force --sign - "$APP_PATH/AccountKeeper"
          codesign -dv "$APP_PATH/AccountKeeper" 2>&1 || true
          echo "Signing complete"

      - name: Package into IPA
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/AccountKeeper.app
          zip -r AccountKeeper.ipa Payload/ -x "*.DS_Store"
          echo "IPA created: AccountKeeper.ipa"
          ls -la AccountKeeper.ipa
          echo "=== IPA contents ==="
          unzip -l AccountKeeper.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccountKeeper-iOS18-ipa
          path: AccountKeeper.ipa
          retention-days: 30
