name: Build HelloWorld IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'helloworld/**'
      - '.github/workflows/build-helloworld-ipa.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'helloworld/**'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build HelloWorld IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Record compile time
        id: compile_time
        run: |
          COMPILE_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "compile_time=$COMPILE_TIME"
          echo "compile_time=$COMPILE_TIME" >> $GITHUB_OUTPUT

      - name: Build for iOS Device (arm64)
        run: |
          xcodebuild build \
            -project helloworld/HelloWorld.xcodeproj \
            -target HelloWorld \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            VALID_ARCHS="arm64"

      - name: Locate built .app
        id: find_app
        run: |
          APP_PATH=$(find build -name "HelloWorld.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "HelloWorld.app" -path "*iphoneos*" | head -1)
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "=== App contents ==="
          ls -la "$APP_PATH"

      - name: Ad-hoc sign app
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          echo "Signing app: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          echo "=== Verify app signature ==="
          codesign -dv "$APP_PATH" 2>&1 | head -20
          echo "Signing complete"

      - name: Package into IPA
        run: |
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/HelloWorld.app
          zip -r HelloWorld.ipa Payload/ -x "*.DS_Store"
          echo "IPA created: HelloWorld.ipa"
          ls -la HelloWorld.ipa
          echo "=== IPA contents ==="
          unzip -l HelloWorld.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-iOS18-ipa
          path: HelloWorld.ipa
          retention-days: 30

      - name: Publish IPA to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete helloworld --yes --cleanup-tag 2>/dev/null || echo "No existing release to delete"
          sleep 2
          gh release create helloworld HelloWorld.ipa \
            --title "HelloWorld iOS 18 Build" \
            --notes "**HelloWorld iOS 18** — 一个极简 SwiftUI 示例应用。架构 arm64 · 部署目标 iOS 18.0 · ad-hoc 签名。使用 Sideloadly / AltStore 配合 Apple ID 重签名后安装。"
          echo "Release created successfully"
          gh release view helloworld --json assets --jq '.assets[].name'
