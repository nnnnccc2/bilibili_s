name: Build BiliBili-G (PiliPlus) IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'BiliBili-G/**'
      - '.github/workflows/build-bilibili-g-ipa.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'BiliBili-G/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build BiliBili-G iOS 18 IPA
    runs-on: macos-14
    permissions:
      contents: write
    defaults:
      run:
        working-directory: BiliBili-G

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: BiliBili-G/pubspec.yaml
          cache: true

      - name: Extract version and create pili_release.json
        run: |
          set -e
          VERSION_NAME=$(awk -F'[ +]' '/^version:/{print $2}' pubspec.yaml)
          VERSION_CODE=$(git rev-list --count HEAD)
          COMMIT_HASH=$(git rev-parse HEAD)
          BUILD_TIME=$(date +%s)
          echo "version=$VERSION_NAME"
          echo "versionCode=$VERSION_CODE"
          # Update pubspec.yaml version using perl (BSD sed -i compatible)
          perl -i -pe "s/^version:.*/version: ${VERSION_NAME}+${VERSION_CODE}/" pubspec.yaml
          # Create pili_release.json
          cat > pili_release.json <<EOF
          {"pili.name":"${VERSION_NAME}","pili.code":${VERSION_CODE},"pili.hash":"${COMMIT_HASH}","pili.time":${BUILD_TIME}}
          EOF
          cat pili_release.json
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
        id: version

      - name: Apply modal barrier patch
        working-directory: ${{ env.FLUTTER_ROOT }}
        run: git apply $GITHUB_WORKSPACE/BiliBili-G/lib/scripts/modal_barrier_patch.diff || true
        continue-on-error: true

      - name: Apply mouse cursor patch
        working-directory: ${{ env.FLUTTER_ROOT }}
        run: git apply $GITHUB_WORKSPACE/BiliBili-G/lib/scripts/mouse_cursor_patch.diff || true
        continue-on-error: true

      - name: Clean Flutter + Xcode + CocoaPods caches (force fresh rebuild)
        run: |
          set -e
          echo "=== Flutter clean ==="
          flutter clean || true
          rm -rf build/ .dart_tool/ .flutter-plugins-dependencies ios/.symlinks ios/Flutter/Flutter.podspec ios/Flutter/Flutter.framework ios/Flutter/Flutter.podspec || true
          echo "=== CocoaPods clean ==="
          rm -rf ios/Pods ios/Podfile.lock || true
          echo "=== Xcode DerivedData clean ==="
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          echo "=== All caches cleaned ==="

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch connectivity_plus for iOS 18 (isUltraConstrained -> isConstrained)
        run: |
          find $PUB_CACHE -path "*connectivity_plus*PathMonitorConnectivityProvider.swift" 2>/dev/null | while read FILE; do
            echo "Patching: $FILE"
            sed -i '' 's/isUltraConstrained/isConstrained/g' "$FILE"
          done
          echo "connectivity_plus patch complete"

      - name: Patch device_info_plus for iOS SDK (isiOSAppOnVision guard)
        run: |
          find $PUB_CACHE -path "*device_info_plus*FPPDeviceInfoPlusPlugin.m" 2>/dev/null | while read FILE; do
            echo "Patching: $FILE"
            # The source uses a local `info` variable: [info isiOSAppOnVision]
            # Replace it with NO since the selector is unavailable on iOS 18 SDK
            sed -i '' 's/\[info isiOSAppOnVision\]/NO/g' "$FILE"
            # Also handle the fallback pattern just in case
            sed -i '' 's/\[\[NSProcessInfo processInfo\] isiOSAppOnVision\]/NO/g' "$FILE"
            echo "--- Patched file (isiOSAppOnVision lines) ---"
            grep -n "isiOSAppOnVision" "$FILE" || echo "no matches"
          done
          echo "device_info_plus patch complete"

      - name: Patch getx to add missing context getters (theme/size/mediaQuery/isDarkMode/width)
        run: |
          find $PUB_CACHE -path "*getx*get_navigation/src/extension_navigation.dart" 2>/dev/null | while read FILE; do
            echo "Patching getx: $FILE"
            # Only add getters if they don't already exist (newer getx versions ship with them)
            if grep -q "get theme" "$FILE"; then
              echo "getters already present, skipping"
            else
              # Insert getters before the static _getxController declaration
              perl -i -pe '
                if (/static GetMaterialController _getxController = GetMaterialController\(\);/) {
                  $_ = "\tThemeData get theme => context != null ? Theme.of(context!) : ThemeData.light();\n" .
                       "\tSize get size => context != null ? MediaQuery.sizeOf(context!) : Size.zero;\n" .
                       "\tMediaQueryData get mediaQuery => context != null ? MediaQuery.of(context!) : const MediaQueryData();\n" .
                       "\tbool get isDarkMode => theme.brightness == Brightness.dark;\n" .
                       "\tdouble get width => size.width;\n" .
                       "\tdouble get height => size.height;\n" .
                       $_;
                }
              ' "$FILE"
              echo "--- Added getters ---"
            fi
            grep -n "get theme\|get size\|get mediaQuery\|get isDarkMode\|get width" "$FILE" | head -10
          done
          echo "getx patch complete"

      - name: Patch flutter_html to remove removed qs.matches call
        run: |
          find $PUB_CACHE -path "*flutter_html*styled_element.dart" 2>/dev/null | while read FILE; do
            echo "Patching flutter_html: $FILE"
            # qs.matches was removed in html 0.15.4+; replace with false (catch already returns false)
            sed -i '' 's/return qs\.matches(element, selector);/return false;/g' "$FILE"
            echo "--- Patched ---"
            grep -n "matches" "$FILE" | head -5
          done
          echo "flutter_html patch complete"

      - name: Patch extended_nested_scroll_view to add ExtendedVisibilityDetector
        run: |
          find $PUB_CACHE -path "*extended_nested_scroll_view*lib/extended_nested_scroll_view.dart" 2>/dev/null | while read FILE; do
            echo "Patching extended_nested_scroll_view: $FILE"
            if ! grep -q "ExtendedVisibilityDetector" "$FILE"; then
              # Ensure material import exists at top of file
              if ! grep -q "package:flutter/material.dart" "$FILE"; then
                # Insert material import after the library directive (library must be first)
                perl -i -pe 's/^(library;.*)$/$1\nimport "package:flutter\/material.dart";/' "$FILE"
              fi
              # Append a simple ExtendedVisibilityDetector widget
              {
                echo ""
                echo "class ExtendedVisibilityDetector extends StatelessWidget {"
                echo "  final Key? uniqueKey;"
                echo "  final Widget child;"
                echo "  const ExtendedVisibilityDetector({super.key, this.uniqueKey, required this.child});"
                echo "  @override"
                echo "  Widget build(BuildContext context) => child;"
                echo "}"
              } >> "$FILE"
              echo "Added ExtendedVisibilityDetector"
            else
              echo "ExtendedVisibilityDetector already present"
            fi
          done
          echo "extended_nested_scroll_view patch complete"

      - name: Patch chat_bottom_container to add keepChatPanel/restoreChatPanel
        run: |
          find $PUB_CACHE -path "*chat_bottom_container*panel_container.dart" 2>/dev/null | while read FILE; do
            echo "Patching chat_bottom_container: $FILE"
            if ! grep -q "keepChatPanel" "$FILE"; then
              # Add no-op keepChatPanel and restoreChatPanel methods to the controller class
              perl -i -pe '
                if (/void _detachState\(\) \{/) {
                  $_ = "\tvoid keepChatPanel() {}\n\tvoid restoreChatPanel() {}\n" . $_;
                }
              ' "$FILE"
              echo "Added keepChatPanel/restoreChatPanel"
            fi
          done
          echo "chat_bottom_container patch complete"

      - name: Pre-build final DerivedData sweep
        run: |
          echo "=== Final Xcode DerivedData sweep before build ==="
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true
          echo "Done"

      - name: Build iOS (release, unsigned)
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json

      - name: Ad-hoc sign frameworks and package IPA
        run: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          echo "App path: $APP_PATH"
          ls -la "$APP_PATH"
          # Ad-hoc sign frameworks
          find "$APP_PATH/Frameworks" -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; 2>/dev/null || true
          # Create Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/BiliBili-G.app
          # Rename the executable inside the .app
          if [ -f "Payload/BiliBili-G.app/Runner" ]; then
            mv "Payload/BiliBili-G.app/Runner" "Payload/BiliBili-G.app/BiliBili-G"
          fi
          # Update Info.plist executable name
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable BiliBili-G" "Payload/BiliBili-G.app/Info.plist" 2>/dev/null || true
          # Inject compile time
          COMPILE_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          /usr/libexec/PlistBuddy -c "Add :BuildCompileTime string '$COMPILE_TIME'" "Payload/BiliBili-G.app/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :BuildCompileTime '$COMPILE_TIME'" "Payload/BiliBili-G.app/Info.plist"
          # Inject commit hash (unique build fingerprint)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          /usr/libexec/PlistBuddy -c "Add :BuildCommit string '$COMMIT_HASH'" "Payload/BiliBili-G.app/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :BuildCommit '$COMMIT_HASH'" "Payload/BiliBili-G.app/Info.plist"
          echo "Build fingerprint: commit=$COMMIT_HASH time=$COMPILE_TIME"
          # Package IPA
          zip -r9 BiliBili-G.ipa Payload/ -x "*.DS_Store"
          echo "IPA created: BiliBili-G.ipa"
          ls -la BiliBili-G.ipa
          unzip -l BiliBili-G.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili-G-iOS18-ipa
          path: BiliBili-G/BiliBili-G.ipa
          retention-days: 30

      - name: Publish IPA to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete bilibili-g-latest --yes --cleanup-tag 2>/dev/null || echo "No existing release to delete"
          sleep 2
          COMPILE_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          BUILD_TAG=$(date -u '+%Y%m%d-%H%M%S')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          cat > RELEASE_NOTES.md <<NOTES_EOF
          # BiliBili-G iOS 18 — CLEAN MiniBili Build

          **唯一标记：$BUILD_TAG | commit $COMMIT_HASH | $COMPILE_TIME**

          | 项目 | 值 |
          |------|-----|
          | 版本 | $BUILD_TAG |
          | Commit | $COMMIT_HASH |
          | 编译时间 | $COMPILE_TIME |
          | 内核 | PiliPlus (Flutter) |
          | UI 风格 | MiniBili |
          | 架构 | arm64 |
          | 最低系统 | iOS 18.0 |
          | 签名方式 | ad-hoc |
          | 构建类型 | CLEAN (flutter clean + DerivedData 全清) |

          ## 功能
          - MiniBili 简约风格界面（biliBlue 主色、浮动胶囊导航、通透卡片、pill 风格标签栏、无 Material 水波纹）
          - PiliPlus 完整功能：推荐、热门、直播、番剧、动态、搜索、播放、弹幕等
          - 二维码登录、观看历史、收藏、下载

          ## 安装
          **请先彻底卸载旧版 BiliBili-G 再安装**，避免 iOS 覆盖安装缓存旧内核。
          使用 Sideloadly / AltStore 配合 Apple ID 重签名后安装。
          NOTES_EOF
          gh release create bilibili-g-latest BiliBili-G.ipa \
            --title "BiliBili-G CLEAN MiniBili Build $BUILD_TAG ($COMMIT_HASH)" \
            --notes-file RELEASE_NOTES.md
          gh release view bilibili-g-latest --json assets,tagName,name --jq '{name:.name, tag:.tagName, assets:[.assets[].name]}'
